<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lista" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/icone-apple.png" />
    <link rel="icon" href="/icone-192.png" />
    <!-- Uma fonte propria e o que mais separa um app com identidade de um
         template: a pilha do sistema entrega Arial no Windows e San Francisco
         no iPhone, e o app fica com cara diferente em cada aparelho. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Lista de Compras</title>
  </head>
  <body>
    <script>
      // O shadcn/ui espera a classe .dark no html, e nao a media query -- e o
      // que faz os utilitarios "dark:" dos componentes colados funcionarem.
      // Roda antes da pintura para nao haver piscada de tema claro.
      (function () {
        try {
          var salvo = localStorage.getItem('lc_tema');
          var escuro = salvo ? salvo === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', escuro);
        } catch (e) {
          /* armazenamento bloqueado: segue no tema claro */
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

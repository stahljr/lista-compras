# Publica o app na Fly.io sem precisar de terminal.
#
# Depois da configuracao inicial (uma vez, no PowerShell), o deploy passa a ser
# um botao aqui no GitHub: aba Actions -> "Publicar na Fly" -> "Run workflow".
# Tambem publica sozinho a cada push nesta branch.
#
# Requer um segredo no repositorio chamado FLY_API_TOKEN
# (Settings -> Secrets and variables -> Actions -> New repository secret).
name: Publicar na Fly

on:
  push:
    branches: [claude/pwa-shopping-list-app-02s0b7]
    # Mexer so na documentacao nao precisa republicar.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

# Dois deploys ao mesmo tempo brigariam pela mesma maquina e pelo mesmo volume.
concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # --remote-only: a imagem e construida nos builders da Fly, entao o
      #   runner do GitHub nao precisa de Docker.
      # --ha=false: uma maquina so. Duas nao montam o mesmo volume nem
      #   compartilham um arquivo SQLite.
      - name: fly deploy
        run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

# Deploy no Fly.io: uma maquina, um volume para o SQLite, HTTPS automatico.
# HTTPS nao e detalhe -- sem ele o navegador nao instala o PWA nem registra o
# service worker, e o app perde o modo offline dentro do mercado.
#
#   fly launch --no-deploy --copy-config
#   fly volumes create dados --size 1 --region gru
#   fly secrets set INVITE_CODE=escolha-um-codigo
#   fly deploy
app = 'lista-compras'
primary_region = 'gru'

[build]

[env]
  PORT = '3000'
  DATA_DIR = '/data'
  REFRESH_HOURS = '12'
  CONDOR_STORE_ID = '1441'

[http_service]
  internal_port = 3000
  force_https = true

  # Espera ociosa: 'suspend' congela a maquina com a memoria intacta, e ela
  # volta em fracao de segundo -- diferente de 'stop', que desliga e obriga a
  # subir o processo de novo. E o que evita a espera longa da primeira tela.
  #
  # Para nao ter espera nenhuma, troque por:
  #   auto_stop_machines = 'off'
  #   min_machines_running = 1
  # Ai a maquina fica sempre de pe (e passa a contar como uso continuo).
  auto_stop_machines = 'suspend'
  auto_start_machines = true

  # Uma maquina so, sempre: o SQLite e um arquivo num volume e nao se
  # compartilha entre instancias. Nao aumente isto.
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'

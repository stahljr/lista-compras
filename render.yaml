# Blueprint do Render: https://render.com/docs/infrastructure-as-code
#
# Nao precisa mais de disco: os dados moram num Postgres gerenciado
# (DATABASE_URL). E o que faz o login valer em qualquer aparelho e sobreviver a
# deploy, reinicio e ao sono do plano gratuito.
services:
  - type: web
    name: lista-compras
    runtime: docker
    dockerfilePath: ./Dockerfile
    # O free serve: o que se perdia nele era o disco, e nao ha mais disco. O
    # unico incomodo e o servico dormir depois de 15 min parado -- a primeira
    # tela depois disso demora quase um minuto. Trocar para "starter" resolve.
    plan: free
    # Perto do banco importa mais que perto de casa: cada tela faz varias
    # consultas, e atravessar os Estados Unidos a cada uma soma. Este projeto
    # esta no Supabase em us-west-2, entao o servidor fica em Oregon.
    # (A regiao de um servico no Render nao muda depois de criado.)
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Connection string do Postgres. No Supabase: Connect > Connection string
      # > Session pooler (host aws-...pooler.supabase.com, porta 5432). A
      # conexao direta (db.<ref>.supabase.co) e so IPv6, e o Render nao alcanca.
      - key: DATABASE_URL
        sync: false
      # Codigo que a segunda pessoa digita para entrar na mesma casa.
      - key: INVITE_CODE
        sync: false

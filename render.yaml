# Blueprint do Render: https://render.com/docs/infrastructure-as-code
#
# Nao precisa mais de disco: os dados moram num Postgres gerenciado
# (DATABASE_URL). E o que faz o login valer em qualquer aparelho e sobreviver a
# deploy, reinicio e ao sono do plano gratuito.
services:
  - type: web
    name: lista-compras
    runtime: docker
    dockerfilePath: ./Dockerfile
    # O free serve: o que se perdia nele era o disco, e nao ha mais disco. O
    # unico incomodo e o servico dormir depois de 15 min parado -- a primeira
    # tela depois disso demora quase um minuto. Trocar para "starter" resolve.
    plan: free
    # O Render nao tem regiao no Brasil; Virginia e a de menor latencia daqui,
    # e a mesma para escolher no Supabase (us-east-1), para o banco ficar perto.
    region: virginia
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Connection string do Postgres. No Supabase: Connect > Connection string
      # > escolha o *pooler* (o host aws-...pooler.supabase.com), porque a
      # conexao direta e so IPv6 e o Render nao alcanca.
      - key: DATABASE_URL
        sync: false
      # Codigo que a segunda pessoa digita para entrar na mesma casa.
      - key: INVITE_CODE
        sync: false

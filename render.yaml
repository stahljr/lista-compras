# Blueprint do Render: https://render.com/docs/infrastructure-as-code
#
# O app e um processo Node com um arquivo SQLite ao lado. O disco em /data e o
# que faz a lista sobreviver a um deploy -- e disco no Render existe **so em
# plano pago** (instancia Starter, o mais barato). No plano free o sistema de
# arquivos e apagado a cada build e a cada reinicio: o app funciona, mas a
# casa, os usuarios e as listas somem sem aviso. Se for ficar no free, use o
# botao "Baixar backup" no Perfil antes de cada deploy.
services:
  - type: web
    name: lista-compras
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    # O Render nao tem regiao no Brasil; Virginia e a de menor latencia daqui.
    region: virginia
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: dados
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      # Codigo que a segunda pessoa digita para entrar na mesma casa. Fica em
      # branco no blueprint de proposito: quem define o valor e voce, no painel.
      - key: INVITE_CODE
        sync: false
